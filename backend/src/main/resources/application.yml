# Configuration is supplied through environment variables (see ../../../../.env.example).
# Nothing secret is stored here. DB_PASSWORD and JWT_SECRET have NO default on purpose:
# the application refuses to start without them.
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: healthcare-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/healthcare_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:healthcare}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (db/migration). Hibernate never changes it.
      # Set JPA_DDL_AUTO=validate to check entities against the schema.
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      fail-on-unknown-properties: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,ai

app:
  clinic-timezone: ${CLINIC_TIMEZONE:Asia/Kolkata}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cookie:
    name: hda_token
    secure: ${COOKIE_SECURE:false}      # true in production (HTTPS)
    same-site: ${COOKIE_SAME_SITE:Lax}  # Strict/Lax for same-site deployments, None (+secure) for cross-site
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:5000}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_TIMEOUT_MS:5000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MIN:10}
    prediction-per-minute: ${RATE_LIMIT_PREDICTION_PER_MIN:20}
  analytics:
    min-group-size: ${ANALYTICS_MIN_GROUP_SIZE:5}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:System Administrator}
  seed:
    demo-doctors: ${SEED_DEMO_DOCTORS:false}
