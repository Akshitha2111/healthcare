# Quick demo WITHOUT MySQL:  SPRING_PROFILES_ACTIVE=h2  (data is lost on restart)
spring:
  datasource:
    url: jdbc:h2:mem:healthcare;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
