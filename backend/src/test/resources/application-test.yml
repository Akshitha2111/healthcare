spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-test-secret-test-secret-1234567890
    expiration-minutes: 30
  ai:
    read-timeout-ms: 800
    connect-timeout-ms: 500
  rate-limit:
    auth-per-minute: 1000
    prediction-per-minute: 1000
  analytics:
    min-group-size: 2
  clinic-timezone: UTC
